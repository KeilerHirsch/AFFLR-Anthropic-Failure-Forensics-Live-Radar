name: Validate AFFLR CI fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile radar
        run: python3 -m py_compile scripts/afflr.py
      - name: Live radar smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp README.md /tmp/README.md
          python3 scripts/afflr.py \
            --output /tmp/afflr-candidates.md \
            --readme /tmp/README.md
          test -s /tmp/afflr-candidates.md
          grep -q "Primary forensic discovery" /tmp/afflr-candidates.md
