name: AFFLR — Anthropic Failure Forensics Live Radar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: afflr-live-radar
  cancel-in-progress: false

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Render AFFLR outputs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp README.md /tmp/README.md
          python3 scripts/afflr.py \
            --output /tmp/afflr-candidates.md \
            --readme /tmp/README.md

      - name: Apply generated outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p watchlist
          cp /tmp/afflr-candidates.md watchlist/candidates.md
          cp /tmp/README.md README.md

      - name: Commit and push generated radar
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md watchlist/candidates.md; then
            echo "AFFLR radar unchanged; nothing to commit."
            exit 0
          fi

          base_sha="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md watchlist/candidates.md

          if git diff --cached --quiet; then
            echo "AFFLR radar unchanged after staging; nothing to commit."
            exit 0
          fi

          git commit -m "chore: update AFFLR live radar"

          git fetch origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$base_sha" ]; then
            echo "remote main moved during AFFLR run; refusing to overwrite" >&2
            exit 1
          fi

          git push origin HEAD:main
